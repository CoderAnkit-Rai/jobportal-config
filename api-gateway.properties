server.port=8080

jwt.secret=your-256-bit-secret-key-here-change-in-production

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# SpringDoc aggregation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Job Service
springdoc.swagger-ui.urls[1].url=/job-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Application Service
springdoc.swagger-ui.urls[2].url=/application-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=/notification-service/v3/api-docs
